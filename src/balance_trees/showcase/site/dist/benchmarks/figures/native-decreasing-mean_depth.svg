<title id="native-decreasing-mean_depth-title">Decreasing · Mean final node depth · edges</title>
<desc id="native-decreasing-mean_depth-desc">Measurements for 1 implementations. Logarithmic key counts and linear vertical scale. Only complete groups are plotted; missing or censored groups leave gaps. Whiskers show one standard error for averages when repeated trials exist. Maximum final height is the maximum observed across those trials. Dashed gray line: 1.36·log₂(n) · endpoint guide. c=max(1, largest endpoint value/log₂(n) across implementations). Descriptive scaling, not a proven bound.</desc>
